name: Feature request
description: Suggest an improvement grounded in intentional phone use
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and simpler alternatives
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, permissions and usability trade-offs
